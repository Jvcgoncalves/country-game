name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          for package_file in package.json apps/web/package.json apps/api/package.json; do
            package_version="$(node -p "require('./${package_file}').version")"
            if [[ "$package_version" != "$tag_version" ]]; then
              echo "Tag ${RELEASE_TAG} does not match ${package_file} version ${package_version}."
              exit 1
            fi
          done

      - name: Upload web production artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  release-preflight:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check release configuration
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          VERCEL_AUTH_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_API_DOMAIN: ${{ vars.VERCEL_API_DOMAIN }}
        run: |
          for setting in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID VERCEL_AUTH_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_API_DOMAIN; do
            if [[ -z "${!setting}" ]]; then
              echo "Missing GitHub repository secret or variable: ${setting}"
              exit 1
            fi
          done
          if [[ ! "$VERCEL_API_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "VERCEL_API_DOMAIN must contain only a hostname, without scheme or path."
            exit 1
          fi

  prepare-vercel-artifact:
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production settings
        run: npm exec --yes --package=vercel@latest -- vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npm exec --yes --package=vercel@latest -- vercel build --prod --token="$VERCEL_TOKEN"

      - name: Upload Vercel production artifact
        uses: actions/upload-artifact@v7
        with:
          name: vercel-output
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-vercel:
    needs: prepare-vercel-artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Vercel production artifact
        uses: actions/download-artifact@v8
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy prebuilt API to Vercel
        run: npm exec --yes --package=vercel@latest -- vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-netlify:
    needs:
      - release-preflight
      - deploy-vercel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      VERCEL_API_DOMAIN: ${{ vars.VERCEL_API_DOMAIN }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download web production artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      - name: Set Vercel API proxy hostname
        working-directory: apps/web/dist
        run: |
          grep -Fq 'YOUR-VERCEL-API-DOMAIN' _redirects
          sed -i "s/YOUR-VERCEL-API-DOMAIN/$VERCEL_API_DOMAIN/g" _redirects

      - name: Deploy prebuilt web app to Netlify
        run: npm exec --yes --package=netlify-cli@latest -- netlify deploy --dir=apps/web/dist --no-build --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
